[project]
name = "analytics-dashboard-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.3",
    "fastapi>=0.136.3",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.49.0",
    "faker>=23.1.0",
    "openai>=1.0.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
    "ruff>=0.15.16",
]

# Run the suite with:  pytest tests/ -v   (from the analytics-dashboard-api dir)
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
